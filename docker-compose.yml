services:
  postgres:
    image: postgres:17-alpine
    container_name: mini-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_erp}
      POSTGRES_USER: ${POSTGRES_USER:-mini_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - mini_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mini_erp} -d ${POSTGRES_DB:-mini_erp}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mini_erp_postgres_data:
